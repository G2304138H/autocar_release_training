_target_: src.dataset.stage2_datamodule.Stage2NPZDataModule

# Override these three paths on the command line or in a local experiment file.
projection_source: ${paths.data_dir}stage2/projections
voxel_source: ${paths.data_dir}stage2/voxels
split_json: ${paths.data_dir}stage2/splits.json

# Slots 0 and 6 are the most widely separated fixed clinical anchors in the
# supplied seven-view schema. Use the identical two views for every comparator.
evaluation_view_indices: [0, 6]
evaluation_view_labels: ["RAO 25, CAU 35", "LAO 5, CRA 40"]
batch_size: 1
num_workers: 2
random_seed: ${seed}
minimum_train_pair_angle_deg: 30.0
pin_memory: true
