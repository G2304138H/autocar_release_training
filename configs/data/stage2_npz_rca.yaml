_target_: src.dataset.stage2_datamodule.Stage2NPZDataModule

# Physical-case inputs supplied for the RCA benchmark.
projection_source: /dataset/reny0012/imagecas_autocar_6/stage_2_imagecas_all_branch
voxel_source: /dataset/reny0012/imagecas_voxel/rca
split_json: /export/home2/reny0012/result/vessel_trees/experiments_for_paper/exp6_rca_bspline_parallel_no_cross_vggt_refiner/split.json

# The split stores rca_0001.npz-style paths, whereas voxel files are named
# <case_number>.npz. Normalising both sides avoids prefix/zero-padding drift.
case_id_mode: imagecas_numeric
expected_imager_pixel_spacing_mm: 0.55

# Older RCA projection files omit these fields. Values are in millimetres and
# match the imagecas_autocar_6 projection configuration (SID 0.9 m).
fallback_imager_pixel_spacing_mm: 0.55
fallback_sid_mm: 900.0
source_to_isocenter_mm: 750.0

# The RCA anchor labels were not supplied. Slots 0 and 6 are provisional until
# their clinical labels are checked on the cluster; their angle is always
# recorded in validation/test outputs.
evaluation_view_indices: [0, 6]
evaluation_view_labels: null
batch_size: 1
num_workers: 0
random_seed: ${seed}
minimum_train_pair_angle_deg: 30.0
excluded_train_case_ids: ["0288", "0421", "0909", "0108", "0207", "0324"]
pin_memory: true
